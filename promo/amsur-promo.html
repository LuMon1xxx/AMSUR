<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>АМСУР — промо · 40 секунд</title>
<style>
:root{color-scheme:dark;background:#080d13}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d13;color:#edf4f5;font-family:Arial,"Segoe UI",sans-serif}body{display:grid;place-items:center;min-height:100vh}.stage{width:min(100vw,177.7778vh);position:relative;background:#080d13;box-shadow:0 20px 80px #0009}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}.controls{position:absolute;left:18px;right:18px;bottom:14px;display:flex;gap:12px;align-items:center;opacity:.05;transition:opacity .2s;font:14px Arial,sans-serif}.stage:hover .controls,.controls:focus-within{opacity:1}.controls button{background:#121e27;color:#eaf4f4;border:1px solid #35505b;border-radius:6px;padding:8px 12px;cursor:pointer}.controls input{flex:1;accent-color:#38d6bd}.controls output{min-width:100px;text-align:right;color:#b3c6cb}img.asset{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style></head>
<body>
<main class="stage" aria-label="Проморолик АМСУР, 40 секунд">
<canvas id="frame" width="1920" height="1080" aria-label="Кинетический проморолик АМСУР"></canvas>
<div class="controls"><button id="play">Пауза</button><input id="scrub" type="range" min="0" max="40" step="0.0333333333" value="0" aria-label="Позиция ролика"><output id="clock">00:00.0 / 00:40.0</output><button id="sound">Включить эмбиент</button></div>
</main>
<!-- Перечисленные источники UI. Файл данных отсутствует; для сцены импорта используем доступный v2-main.png. -->
<img class="asset" id="ui-import" src="../скрины/главная.png" alt="">
<img class="asset" id="ui-main" src="../.opencode/compose-plus/screens/v2-main.png" alt="">
<img class="asset" id="ui-generate" src="../.opencode/compose-plus/screens/v2-generate.png" alt="">
<img class="asset" id="ui-matrix" src="../.opencode/compose-plus/screens/v2-schedule-matrix.png" alt="">
<img class="asset" id="ui-table" src="../.opencode/compose-plus/screens/v2-schedule-table.png" alt="">
<img class="asset" id="ui-quality" src="../.opencode/compose-plus/screens/v2-settings-quality.png" alt="">
<script>
'use strict';
// АМСУР promo timeline — 1920×1080, 30 fps, exactly 40 seconds / 1200 frames.
const W=1920,H=1080,FPS=30,DURATION=40,TAU=Math.PI*2;
const SCENES=[
 {id:'hook',start:0,end:4}, {id:'import',start:4,end:9},
 {id:'generate',start:9,end:16}, {id:'quality',start:16,end:22},
 {id:'choice',start:22,end:28}, {id:'human',start:28,end:33},
 {id:'end',start:33,end:40}
];
const c=document.querySelector('#frame'),ctx=c.getContext('2d',{alpha:false});
const images=Object.fromEntries([...document.querySelectorAll('img.asset')].map(i=>[i.id,i]));
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
const smooth=(t,a,b)=>ease((t-a)/(b-a));
const mix=(a,b,p)=>a+(b-a)*p;
const pixel=n=>Math.round(n);
function rect(x,y,w,h,color,r=0){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(pixel(x),pixel(y),pixel(w),pixel(h),r);ctx.fill()}
function text(str,x,y,size,color='#eff8f7',weight=600,align='left',font='Arial, Segoe UI, sans-serif'){
 ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(str,pixel(x),pixel(y));
}
function line(x1,y1,x2,y2,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(pixel(x1),pixel(y1));ctx.lineTo(pixel(x2),pixel(y2));ctx.stroke()}
function base(t){ctx.fillStyle='#080d13';ctx.fillRect(0,0,W,H);
 const g=ctx.createRadialGradient(1420,410,30,1420,410,1050);g.addColorStop(0,'#11232a');g.addColorStop(.55,'#0b141c');g.addColorStop(1,'#080d13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // fixed graphic grain/grid—no random values
 ctx.strokeStyle='rgba(116,170,178,.055)';ctx.lineWidth=1;
 for(let x=80;x<W;x+=80){line(x,0,x,H,'rgba(116,170,178,.035)',1)}
 for(let y=60;y<H;y+=80){line(0,y,W,y,'rgba(116,170,178,.035)',1)}
 const p=(t*72)%120;rect(0,0,6,H,'#1c3138');rect(0,p,6,190,'#40ddc3',0);
}
function imageCard(img,x,y,w,h,progress,scale=1.08,pan=.5){
 rect(x+12,y+14,w,h,'rgba(0,0,0,.42)',18);ctx.save();ctx.beginPath();ctx.roundRect(pixel(x),pixel(y),pixel(w),pixel(h),16);ctx.clip();
 ctx.fillStyle='#101a22';ctx.fillRect(x,y,w,h);
 if(img&&img.complete&&img.naturalWidth){const k=Math.max(w/img.naturalWidth,h/img.naturalHeight)*scale;const iw=img.naturalWidth*k,ih=img.naturalHeight*k;
 const drift=(1-progress)*24;const dx=x+(w-iw)*pan+drift,dy=y+(h-ih)*.5;ctx.drawImage(img,pixel(dx),pixel(dy),pixel(iw),pixel(ih));
 ctx.fillStyle='rgba(5,10,15,.12)';ctx.fillRect(x,y,w,h);
 }else{rect(x+28,y+28,w-56,h-56,'#101a22',10);text('СКРИНШОТ НЕ НАЙДЕН',x+w/2,y+h/2,24,'#9bb2b8',700,'center');}
 ctx.restore();ctx.strokeStyle='rgba(123,211,204,.28)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(pixel(x),pixel(y),pixel(w),pixel(h),16);ctx.stroke();
}
function chip(label,x,y,w){rect(x,y,w,54,'#11252b',27);rect(x+14,y+16,20,20,'#43ddc1',10);text(label,x+48,y+27,22,'#dceeed',600)}
function sceneHook(t){const p=t/4,fade=smooth(t,0,.45)*(1-smooth(t,3.65,4));
 // abstract clocks / constraint nodes converge into a timetable lattice
 for(let i=0;i<9;i++){const a=i*TAU/9+p*.8,rad=mix(590,335,ease(p));const x=960+Math.cos(a)*rad,y=515+Math.sin(a)*rad*.62;
 ctx.strokeStyle=`rgba(62,220,195,${.12+.18*fade})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(pixel(x),pixel(y),pixel(18+4*Math.sin(t*2+i)),0,TAU);ctx.stroke();
 rect(x-4,y-4,8,8,'#56e0c9',4)}
 const gx=450,gy=280,gw=1020,gh=420;ctx.strokeStyle='rgba(72,201,184,.20)';ctx.lineWidth=2;
 for(let i=0;i<=10;i++)line(gx+i*gw/10,gy,gx+i*gw/10,gy+gh,'rgba(91,208,196,.18)',1);
 for(let i=0;i<=5;i++)line(gx,gy+i*gh/5,gx+gw,gy+i*gh/5,'rgba(91,208,196,.18)',1);
 rect(gx+22,gy+28,gw*.62,gh*.18,'rgba(44,199,174,.18)',10);rect(gx+gw*.68,gy+gh*.43,gw*.25,gh*.16,'rgba(236,176,88,.16)',10);
 const alpha=fade;ctx.globalAlpha=alpha;text('Сотни уроков.',960,785,76,'#f0f5f2',700,'center');text('Десятки ограничений.',960,870,76,'#9fb9bd',600,'center');text('Одно расписание.',960,965,78,'#44ddc1',700,'center');ctx.globalAlpha=1;
}
function sceneImport(t){const p=(t-4)/5,enter=smooth(t,4,4.5);imageCard(images['ui-import'],820,205,970,590,p,1.16,.44);
 text('01  /  ИМПОРТ ДАННЫХ',130,170,23,'#44ddc1',700);text('Начните с нагрузки',130,340,63,'#f1f6f4',700);text('Из Excel — в проверенную',130,416,37,'#a9c1c3',500);text('структуру данных.',130,463,37,'#a9c1c3',500);
 chip('Проверка входных данных',130,570,390);text('XLSX',134,730,22,'#edbf74',700);text('Локально. Без облака.',130,790,24,'#718a90',500);
 ctx.globalAlpha=enter;text('Загрузите нагрузку — АМСУР проверит данные.',130,920,31,'#d6e4e2',500);ctx.globalAlpha=1;
}
function sceneGenerate(t){const p=(t-9)/7;imageCard(images['ui-generate'],870,200,910,570,p,1.12,.58);
 text('02  /  ПОИСК РЕШЕНИЯ',130,170,23,'#44ddc1',700);text('Сначала — черновик.',130,340,58,'#f1f6f4',700);text('Затем поиск качества.',130,409,47,'#9bb3b7',600);
 text('1196',130,565,78,'#44ddc1',700);text('УРОКОВ',132,620,19,'#90a9ae',700);text('40',370,565,78,'#edbd72',700);text('КЛАССОВ',372,620,19,'#90a9ae',700);text('100',590,565,78,'#e8efed',700);text('УЧИТЕЛЕЙ',592,620,19,'#90a9ae',700);
 rect(130,702,500,3,'#263e43');rect(130,702,500*clamp((p-.2)/.8),3,'#44ddc1');
 text('Первый черновик ≈ 0,1 с',130,756,27,'#d7e3e1',600);text('Стандартный поиск — до 12 с',130,810,27,'#d7e3e1',600);
 text('Первый вариант — почти мгновенно. Стандартный поиск — до двенадцати секунд.',130,920,29,'#d6e4e2',500);
}
function sceneQuality(t){const p=(t-16)/6;imageCard(images['ui-matrix'],700,205,1080,610,p,1.18,.52);
 text('03  /  КАЧЕСТВО',130,170,23,'#44ddc1',700);text('Результат',130,350,66,'#f1f6f4',700);text('на эталоне',130,422,45,'#9bb3b7',600);
 text('0',130,560,100,'#44ddc1',700);text('окон у учеников',215,560,30,'#e1ece9',600);text('0',130,680,100,'#44ddc1',700);text('жёстких нарушений',215,680,30,'#e1ece9',600);
 text('Окна учителей считаются отдельно',130,800,24,'#edbd72',600);text('и не скрываются.',130,840,24,'#edbd72',600);
 text('Окна учителей считаются отдельно и показываются честно.',130,936,29,'#d6e4e2',500);
}
function sceneChoice(t){const p=(t-22)/6;imageCard(images['ui-table'],690,180,1090,630,p,1.14,.52);
 text('04  /  ЧЕЛОВЕК ВЫБИРАЕТ',130,170,23,'#44ddc1',700);text('Несколько вариантов.',130,365,58,'#f1f6f4',700);text('У каждого — объяснение.',130,432,38,'#a9c1c3',600);
 for(let i=0;i<5;i++){const y=550+i*64;rect(130,y,470,47,i===Math.floor(p*5)?'#173c3b':'#122128',8);rect(146,y+13,20,20,i===Math.floor(p*5)?'#44ddc1':'#466067',10);text(`Вариант ${i+1}`,184,y+23,22,'#dfebe9',600);text(i===Math.floor(p*5)?'выбран':'объяснён',548,y+23,16,'#8fa8ac',500,'right')}
 text('АМСУР объясняет варианты. Человек выбирает.',130,960,30,'#d6e4e2',500);
}
function sceneHuman(t){const p=(t-28)/5;const a=smooth(t,28,28.55);ctx.globalAlpha=a;text('Не замена завуча.',960,420,78,'#9db4b8',600,'center');
 const lift=(1-ease((t-30.9)/1.5))*24;text('Освобождение',960,555-lift,102,'#f0f5f2',700,'center');text('от рутины.',960,675-lift,102,'#44ddc1',700,'center');
 // choices converge into a single calm signal
 for(let i=0;i<5;i++){const x=430+i*265,y=825;rect(x,y,110,8,'#2e7774',4);rect(x+34,y-9,30,26,'#44ddc1',13);line(x+75,y+4,960,936,'rgba(61,213,190,.2)',2)}
 ctx.globalAlpha=1;
}
function sceneEnd(t){const p=(t-33)/7,fade=smooth(t,33,33.5);ctx.globalAlpha=fade;
 // typographic mark; no unavailable logo file is implied
 text('АМСУР',960,300,120,'#f2f6f3',800,'center');rect(700,382,520,4,'#44ddc1',2);
 text('Человек решает.',960,520,65,'#e3ece9',600,'center');text('Программа считает.',960,608,65,'#44ddc1',700,'center');
 text('бесплатно  ·  офлайн  ·  по-русски  ·  MIT',960,754,31,'#b2c7c6',600,'center');
 text('Лучшее найденное расписание — не «оптимальное».',960,925,23,'#82979b',500,'center');
 text('АМСУР  /  ШКОЛЬНОЕ РАСПИСАНИЕ',960,1000,17,'#536b70',700,'center');ctx.globalAlpha=1;
}
function draw(t){t=clamp(Number(t)||0,0,DURATION);base(t);
 const s=SCENES.find(v=>t>=v.start&&t<v.end)||SCENES[SCENES.length-1];
 if(s.id==='hook')sceneHook(t);else if(s.id==='import')sceneImport(t);else if(s.id==='generate')sceneGenerate(t);else if(s.id==='quality')sceneQuality(t);else if(s.id==='choice')sceneChoice(t);else if(s.id==='human')sceneHuman(t);else sceneEnd(t);
 // deterministic scene in/out dip; exact seconds, stable pixel coordinates
 const edge=Math.min(smooth(t,s.start,s.start+.24),1-smooth(t,s.end-.24,s.end));
 if(edge<1){ctx.fillStyle=`rgba(4,8,12,${(1-edge)*.38})`;ctx.fillRect(0,0,W,H)}
 return {time:t,scene:s.id,frame:Math.round(t*FPS)};
}
window.drawFrame=draw;window.PROMO={width:W,height:H,fps:FPS,duration:DURATION,frames:FPS*DURATION,scenes:SCENES};
let playing=true,started=performance.now(),offset=0,raf=0;
const scrub=document.querySelector('#scrub'),clock=document.querySelector('#clock'),playBtn=document.querySelector('#play');
function tick(now){if(playing){const t=Math.min(DURATION,offset+(now-started)/1000);draw(t);scrub.value=String(t);clock.value=`00:${String(Math.floor(t/60)).padStart(2,'0')}:${String((t%60).toFixed(1)).padStart(4,'0')} / 00:40.0`;if(t>=DURATION){playing=false;playBtn.textContent='Повторить'}}raf=requestAnimationFrame(tick)}
playBtn.onclick=()=>{if(!playing&&offset>=DURATION){offset=0;scrub.value='0'}playing=!playing;started=performance.now();playBtn.textContent=playing?'Пауза':'Воспроизвести'};
scrub.oninput=()=>{offset=Number(scrub.value);started=performance.now();draw(offset);clock.value=`${offset.toFixed(1)} / 40.0`};
// Optional synthesized ambient, scheduled against WebAudio time; never affects image-frame timing.
let audio=null,osc=null,gain=null;document.querySelector('#sound').onclick=e=>{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();gain=audio.createGain();gain.gain.value=0;gain.connect(audio.destination);osc=audio.createOscillator();osc.type='sine';osc.frequency.value=110;const osc2=audio.createOscillator();osc2.type='sine';osc2.frequency.value=164.81;const g2=audio.createGain();g2.gain.value=.22;osc.connect(gain);osc2.connect(g2);g2.connect(gain);osc.start();osc2.start();gain.gain.setTargetAtTime(.045,audio.currentTime,.8);e.target.textContent='Выключить эмбиент'}else{gain.gain.setTargetAtTime(0,audio.currentTime,.35);e.target.textContent='Включить эмбиент'}};
// Headless renderer entry: ?t=seconds renders exactly the requested time, pauses playback.
const param=new URLSearchParams(location.search).get('t');if(param!==null){playing=false;offset=Number(param)||0;draw(offset);playBtn.textContent='Воспроизвести'}else draw(0);raf=requestAnimationFrame(tick);
</script></body></html>
